server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- 安全头（PWA 需要 HTTPS 才能用部分能力，但本地/内网不影响） ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "camera=(self), geolocation=() (self), microphone=()" always;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/xml+rss
        application/vnd.api+json
        image/svg+xml;

    # ---- PWA: Service Worker 必须在根作用域且不能缓存 ----
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # PWA manifest 缓存可短一点
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600" always;
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # ---- 长缓存：SvelteKit 构建产物（hash 文件名，永不过期） ----
    location /_app/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- 图标等静态资源 ----
    location ~* \.(?:png|jpg|jpeg|gif|webp|ico|svg)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ---- 字体 ----
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ---- API 反代到后端服务（容器名 duorou-api） ----
    location /api/ {
        proxy_pass http://api:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # ---- SPA fallback：所有未知路径回 index.html ----
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # 错误页 fallback
    error_page 404 /index.html;

    # ---- 客户端上传大小（PWA 用 IndexedDB，所以这里设小一点） ----
    client_max_body_size 10m;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}