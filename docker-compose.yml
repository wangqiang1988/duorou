# 多肉成长记 · docker-compose
# 推荐用 docker compose v2（compose-plugin）：`docker compose up -d --build`
# 旧版 v1（docker-compose）也可能能跑，但遇到 KeyError: 'ContainerConfig' 请升级

version: "3.8"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: duorou-api:latest
    container_name: duorou-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - PORT=3011
      - HOST=0.0.0.0
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3011/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - duorou-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: duorou-app:latest
    container_name: duorou
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${DUOROU_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - duorou-net

  dev:
    image: node:20-alpine
    container_name: duorou-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/api/node_modules
    command: sh -c "
        cd /app/api && npm config set registry https://registry.npmmirror.com && npm install --no-audit --no-fund
        cd /app && npm config set registry https://registry.npmmirror.com && npm install --no-audit --no-fund
        cd /app/api && npm run dev & npm run dev -- --host 0.0.0.0 && wait
      "
    ports:
      - "${DUOROU_DEV_PORT:-5173}:5173"
      - "${DUOROU_API_PORT:-3011}:3011"
    profiles:
      - dev
    networks:
      - duorou-net

networks:
  duorou-net:
    driver: bridge